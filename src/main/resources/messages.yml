# Values are rendered literally; formatting tags are not parsed.
# Reload with /port reload. Invalid text or colors reject the entire reload.
# Message values must be non-empty, single-line strings. Missing keys use bundled defaults.
theme:
  # Each theme entry requires a #RRGGBB color. Keep the value quoted for YAML.
  accent: '#70C8C3'
  secondary: '#87BDE8'
  text: '#D9E3ED'
  label: '#ADB9C8'
  muted: '#8392A5'
  separator: '#3C5267'
  warning: '#D7B779'
  error: '#E18E95'

# Shared chat prefix, panel separator and section headings.
prefix: 'Port Bridge >'
separator: '----------------------------------------'
status-title: 'PORT BRIDGE'
status-subtitle: 'Your server, a connection away.'
help-title: 'PORT BRIDGE · HELP'
help-subtitle: 'Open a tunnel. Share the address. Play together.'
address-title: 'CONNECTION ADDRESS'
connected-title: 'YOUR SERVER IS REACHABLE'
relay-title: 'RELAY CONNECTED'
address-subtitle: 'Share this address with your friends.'
address-hint: 'Use Multiplayer > Direct Connection in Minecraft Java.'
unverified-hint: 'Public route checks are disabled.'
no-address: 'No public address yet. Use /pb start, then /pb status.'

# Status-panel labels and route-check indicators.
label-state: 'State'
label-address: 'Address'
label-local: 'Local server'
label-relay: 'Relay'
label-health: 'Public checks'
health-enabled: 'Enabled'
health-disabled: 'Disabled · route unverified'
label-uptime: 'Connected for'
label-latency: 'Route latency'
label-retry: 'Next retry'
label-detail: 'Details'
label-error: 'Last error'

# Display names for each tunnel lifecycle state.
state-stopped: 'Stopped'
state-preparing: 'Preparing Bore'
state-connecting: 'Connecting'
state-online: 'Online'
state-degraded: 'Route unavailable'
state-reconnecting: 'Reconnecting'
state-failed: 'Failed'

# Action labels and hover text. Controls respect the sender's command permissions.
button-copy: '[ COPY ADDRESS ]'
button-start: '[ START ]'
button-stop: '[ STOP ]'
button-restart: '[ RESTART ]'
button-status: '[ REFRESH ]'
hover-copy: 'Click to copy the public connection address.'
hover-start: 'Start the tunnel to your local server.'
hover-stop: 'Stop the tunnel. Remote players will disconnect.'
hover-restart: 'Restart the tunnel. The public address may change.'
hover-status: 'Refresh the current connection status.'

# Command descriptions shown by /port help.
help-status: 'Show the connection state and tunnel details.'
help-address: 'Show and copy your public address.'
help-start: 'Start the tunnel.'
help-stop: 'Stop the tunnel.'
help-restart: 'Restart the tunnel.'
help-reload: 'Reload settings and messages.'
help-hint: 'Aliases: /portbridge, /port, /pb. Click a command to fill it in.'

