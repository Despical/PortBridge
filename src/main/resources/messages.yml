'command-restarted': 'Restarting the tunnel. The join address may change.'
'command-reloaded': 'Configuration and messages reloaded. An active tunnel will reconnect.'
'command-reload-failed': 'Reload rejected: {reason}. The previous settings remain active.'
'latency-value': '{millis} ms'
'retry-value': '{seconds}s (attempt {attempt})'
'uptime-hours': '{hours}h {minutes}m'
'uptime-minutes': '{minutes}m {seconds}s'
'uptime-seconds': '{seconds}s'
'console-command-suffix': ' ({command})'
'help-command-label': '  {command}'
'detail-stopped': 'Tunnel is stopped.'
'detail-preparing': 'Preparing Bore and checking Minecraft.'
'detail-connecting': 'Connecting to {host}.'
'detail-allocated': 'Relay allocated a port; checking the Minecraft route.'
'detail-unverified': 'Relay connected. Public Minecraft checks are disabled.'
'detail-online': 'Minecraft responds through the tunnel.'
'detail-failed': 'Tunnel stopped after a connection failure.'
'detail-reconnecting': 'Retrying in {seconds} seconds.'
'error-local-listener': 'Local Minecraft server did not respond at {address}. Check the bind address, port and enable-status=true: {reason}'
'error-start': 'Could not start tunnel: {reason}'
'error-port-timeout': 'Bore did not allocate a public port within 20 seconds.'
'error-output': 'Cannot read Bore output: {reason}'
'error-public-probe': 'Public Minecraft check failed: {reason}'
'error-process-exit': 'Bore exited with code {code}.'
'error-process-output': 'Bore exited with code {code}: {output}'

