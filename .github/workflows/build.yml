name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Validate documentation
        run: ./gradlew javadocJar --no-daemon --console=plain

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portbridge
          path: build/libs/*.jar
          if-no-files-found: error
